<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 碎片时间收集器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        .card { width: 100%; max-width: 400px; background: #fff; border-radius: 12px; padding: 48px 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .card h1 { font-size: 1.5rem; font-weight: 600; color: #1f2937; text-align: center; margin-bottom: 8px; }
        .card .subtitle { font-size: 0.875rem; color: #9ca3af; text-align: center; margin-bottom: 32px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-group input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .btn { width: 100%; padding: 11px; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .btn:hover { background: #4f46e5; }
        .error { color: #ef4444; font-size: 0.8rem; text-align: center; margin-top: 12px; display: none; }
        .switch-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #6b7280; }
        .switch-link a { color: #6366f1; text-decoration: none; font-weight: 500; cursor: pointer; }
        .switch-link a:hover { text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>碎片时间收集器</h1>
        <p class="subtitle" id="subtitle">请登录以继续</p>

        <form id="loginForm">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="loginUsername" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>

        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label>账号</label>
                <input type="text" id="regUsername" required>
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="regNickname" placeholder="留空则与账号相同">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" required minlength="6">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regConfirm" required minlength="6">
            </div>
            <div class="form-group">
                <label>邀请码</label>
                <input type="text" id="regInvite" required maxlength="6" placeholder="6位邀请码" style="text-transform:uppercase">
            </div>
            <button type="submit" class="btn">注册</button>
        </form>

        <div class="error" id="error"></div>
        <div class="switch-link">
            <span id="switchText">还没有账号？</span>
            <a id="switchBtn">注册</a>
        </div>
    </div>

    <script>
        let isLogin = true;
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const errEl = document.getElementById('error');

        document.getElementById('switchBtn').addEventListener('click', () => {
            isLogin = !isLogin;
            loginForm.classList.toggle('hidden', !isLogin);
            registerForm.classList.toggle('hidden', isLogin);
            document.getElementById('subtitle').textContent = isLogin ? '请登录以继续' : '注册新账号';
            document.getElementById('switchText').textContent = isLogin ? '还没有账号？' : '已有账号？';
            document.getElementById('switchBtn').textContent = isLogin ? '注册' : '登录';
            errEl.style.display = 'none';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errEl.style.display = 'none';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('loginUsername').value, password: document.getElementById('loginPassword').value })
                });
                const data = await res.json();
                if (res.ok) window.location.href = '/';
                else { errEl.textContent = data.error; errEl.style.display = 'block'; }
            } catch (err) { errEl.textContent = '网络错误'; errEl.style.display = 'block'; }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errEl.style.display = 'none';
            const pwd = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            if (pwd !== confirm) { errEl.textContent = '两次密码不一致'; errEl.style.display = 'block'; return; }
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('regUsername').value,
                        nickname: document.getElementById('regNickname').value,
                        password: pwd,
                        confirmPassword: confirm,
                        inviteCode: document.getElementById('regInvite').value.toUpperCase()
                    })
                });
                const data = await res.json();
                if (res.ok) window.location.href = '/';
                else { errEl.textContent = data.error; errEl.style.display = 'block'; }
            } catch (err) { errEl.textContent = '网络错误'; errEl.style.display = 'block'; }
        });
    </script>
</body>
</html>
