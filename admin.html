<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 碎片时间收集器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; overflow-x: hidden; }
        .sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; z-index: 200; transition: transform 0.3s ease; }
        .sidebar-user { padding: 24px 20px; border-bottom: 1px solid #f3f4f6; text-align: center; cursor: pointer; text-decoration: none; display: block; }
        .sidebar-user:hover { background: #f9fafb; }
        .sidebar-user .avatar { width: 44px; height: 44px; border-radius: 50%; background: #6366f1; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 600; margin: 0 auto 10px; overflow: hidden; }
        .sidebar-user .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-user .name { font-size: 0.9rem; font-weight: 600; color: #1f2937; }
        .sidebar-nav { flex: 1; padding: 12px 8px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.875rem; color: #4b5563; text-decoration: none; transition: all 0.15s; margin-bottom: 2px; }
        .sidebar-nav a:hover { background: #f3f4f6; color: #1f2937; }
        .sidebar-nav a.active { background: #eef2ff; color: #6366f1; font-weight: 500; }
        .sidebar-nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
        .sidebar-footer { padding: 12px 8px; border-top: 1px solid #f3f4f6; }
        .sidebar-footer a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.875rem; color: #4b5563; text-decoration: none; transition: all 0.15s; }
        .sidebar-footer a:hover { background: #f3f4f6; color: #1f2937; }
        .sidebar-footer a svg { width: 18px; height: 18px; flex-shrink: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 150; }
        .main-content { margin-left: 240px; padding: 32px; transition: margin-left 0.3s ease; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .page-header h2 { font-size: 1.25rem; font-weight: 600; color: #1f2937; }
        .btn-sm { padding: 7px 16px; font-size: 0.8rem; border-radius: 6px; border: 1px solid #e5e7eb; background: #fff; color: #374151; cursor: pointer; transition: all 0.2s; text-decoration: none; }
        .btn-sm:hover { border-color: #6366f1; color: #6366f1; }
        .btn-sm.primary { background: #6366f1; color: #fff; border-color: #6366f1; }
        .btn-sm.primary:hover { background: #4f46e5; }
        .btn-sm.danger { color: #ef4444; border-color: #fecaca; }
        .btn-sm.danger:hover { background: #fef2f2; border-color: #ef4444; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,0.04); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; font-size: 0.875rem; }
        th { background: #f9fafb; color: #6b7280; font-weight: 500; border-bottom: 1px solid #e5e7eb; }
        td { border-bottom: 1px solid #f3f4f6; color: #374151; }
        tr:last-child td { border-bottom: none; }
        .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
        .role-admin { background: #eef2ff; color: #6366f1; }
        .role-user { background: #f3f4f6; color: #6b7280; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 300; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 12px; padding: 32px; width: 90%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
        .modal h3 { font-size: 1.1rem; font-weight: 600; color: #1f2937; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: #374151; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 9px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #6366f1; }
        .form-group input:disabled { background: #f9fafb; color: #9ca3af; cursor: not-allowed; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <a href="/profile.html" class="sidebar-user">
            <div class="avatar" id="avatar">?</div>
            <div class="name" id="userName">加载中...</div>
        </a>
        <nav class="sidebar-nav">
            <a href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                主页
            </a>
            <a href="/admin.html" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                用户管理
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="/settings.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                账号设置
            </a>
        </div>
    </aside>

    <div class="main-content">
        <div class="page-header">
            <h2>用户管理</h2>
            <button class="btn-sm primary" id="addBtn">添加用户</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>账号</th><th>昵称</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">添加用户</h3>
            <form id="userForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="formUsername" required>
                </div>
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="formNickname" placeholder="留空则与账号相同">
                </div>
                <div class="form-group">
                    <label>密码 <span id="pwdHint" style="color:#9ca3af;font-weight:400"></span></label>
                    <input type="password" id="formPassword">
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="formRole"><option value="user">普通用户</option><option value="admin">管理员</option></select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-sm" id="cancelBtn">取消</button>
                    <button type="submit" class="btn-sm primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        let touchStartX = 0, touchStartY = 0, sidebarOpen = false;

        (async () => {
            const res = await fetch('/api/me');
            if (!res.ok) { window.location.href = '/login.html'; return; }
            const user = await res.json();
            document.getElementById('userName').textContent = user.nickname;
            document.getElementById('avatar').innerHTML = user.avatar ? `<img src="${user.avatar}">` : user.nickname.charAt(0).toUpperCase();
        })();

        function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); sidebarOpen = true; }
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); sidebarOpen = false; }
        overlay.addEventListener('click', closeSidebar);

        document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            if (sidebarOpen) return;
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            if (dx > 30 && Math.abs(dy) < Math.abs(dx)) openSidebar();
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) < 30 || Math.abs(dy) > Math.abs(dx)) return;
            if (dx < 0 && sidebarOpen) closeSidebar();
        }, { passive: true });

        const modalOverlay = document.getElementById('modalOverlay');
        const form = document.getElementById('userForm');

        async function loadUsers() {
            const res = await fetch('/api/users');
            if (!res.ok) { window.location.href = '/login.html'; return; }
            const users = await res.json();
            document.getElementById('userTable').innerHTML = users.map(u => `
                <tr>
                    <td>${esc(u.username)}</td>
                    <td>${esc(u.nickname)}</td>
                    <td><span class="role-badge role-${u.role}">${u.role === 'admin' ? '管理员' : '用户'}</span></td>
                    <td>${new Date(u.createdAt).toLocaleDateString('zh-CN')}</td>
                    <td>
                        <button class="btn-sm" onclick="editUser('${u.id}','${esc(u.username)}','${esc(u.nickname)}','${u.role}')">编辑</button>
                        <button class="btn-sm danger" onclick="delUser('${u.id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        document.getElementById('addBtn').onclick = () => {
            document.getElementById('modalTitle').textContent = '添加用户';
            document.getElementById('editId').value = '';
            form.reset();
            document.getElementById('pwdHint').textContent = '';
            document.getElementById('formPassword').required = true;
            document.getElementById('formUsername').disabled = false;
            modalOverlay.classList.add('active');
        };

        window.editUser = (id, username, nickname, role) => {
            document.getElementById('modalTitle').textContent = '编辑用户';
            document.getElementById('editId').value = id;
            document.getElementById('formUsername').value = username;
            document.getElementById('formUsername').disabled = true;
            document.getElementById('formNickname').value = nickname;
            document.getElementById('formRole').value = role;
            document.getElementById('formPassword').value = '';
            document.getElementById('formPassword').required = false;
            document.getElementById('pwdHint').textContent = '(留空则不修改)';
            modalOverlay.classList.add('active');
        };

        window.delUser = async (id) => {
            if (!confirm('确定删除该用户？')) return;
            await fetch(`/api/users/${id}`, { method: 'DELETE' });
            loadUsers();
        };

        document.getElementById('cancelBtn').onclick = () => modalOverlay.classList.remove('active');
        modalOverlay.onclick = (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove('active'); };

        form.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const body = { role: document.getElementById('formRole').value };
            const nick = document.getElementById('formNickname').value.trim();
            if (nick) body.nickname = nick;
            const pwd = document.getElementById('formPassword').value;
            if (pwd) body.password = pwd;
            if (!id) body.username = document.getElementById('formUsername').value;
            const url = id ? `/api/users/${id}` : '/api/users';
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            modalOverlay.classList.remove('active');
            loadUsers();
        };

        loadUsers();
    </script>
    <script src="/tracker.js"></script>
    <script src="/loader.js"></script>
</body>
</html>
