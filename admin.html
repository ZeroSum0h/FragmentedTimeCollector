<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 碎片时间收集器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }
        .navbar .brand { font-size: 1rem; font-weight: 600; color: #1f2937; }
        .navbar .actions { display: flex; align-items: center; gap: 12px; }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            background: #fff;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-sm:hover { border-color: #6366f1; color: #6366f1; }
        .btn-sm.primary { background: #6366f1; color: #fff; border-color: #6366f1; }
        .btn-sm.primary:hover { background: #4f46e5; }
        .btn-sm.danger { color: #ef4444; border-color: #fecaca; }
        .btn-sm.danger:hover { background: #fef2f2; border-color: #ef4444; }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 24px 40px;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-header h2 { font-size: 1.25rem; font-weight: 600; color: #1f2937; }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; font-size: 0.875rem; }
        th { background: #f9fafb; color: #6b7280; font-weight: 500; border-bottom: 1px solid #e5e7eb; }
        td { border-bottom: 1px solid #f3f4f6; color: #374151; }
        tr:last-child td { border-bottom: none; }
        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .role-admin { background: #eef2ff; color: #6366f1; }
        .role-user { background: #f3f4f6; color: #6b7280; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .modal h3 { font-size: 1.1rem; font-weight: 600; color: #1f2937; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: #374151; margin-bottom: 4px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #6366f1; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <span class="brand">碎片时间收集器</span>
        <div class="actions">
            <a href="/" class="btn-sm">返回首页</a>
            <button class="btn-sm" id="logoutBtn">退出</button>
        </div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h2>用户管理</h2>
            <button class="btn-sm primary" id="addBtn">添加用户</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">添加用户</h3>
            <form id="userForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="formUsername" required>
                </div>
                <div class="form-group">
                    <label>密码 <span id="pwdHint" style="color:#9ca3af;font-weight:400"></span></label>
                    <input type="password" id="formPassword">
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="formRole"><option value="user">普通用户</option><option value="admin">管理员</option></select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-sm" id="cancelBtn">取消</button>
                    <button type="submit" class="btn-sm primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('modalOverlay');
        const form = document.getElementById('userForm');

        async function loadUsers() {
            const res = await fetch('/api/users');
            if (!res.ok) { window.location.href = '/login.html'; return; }
            const users = await res.json();
            document.getElementById('userTable').innerHTML = users.map(u => `
                <tr>
                    <td>${esc(u.username)}</td>
                    <td><span class="role-badge role-${u.role}">${u.role === 'admin' ? '管理员' : '用户'}</span></td>
                    <td>${new Date(u.createdAt).toLocaleDateString('zh-CN')}</td>
                    <td>
                        <button class="btn-sm" onclick="editUser('${u.id}','${esc(u.username)}','${u.role}')">编辑</button>
                        <button class="btn-sm danger" onclick="delUser('${u.id}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        document.getElementById('addBtn').onclick = () => {
            document.getElementById('modalTitle').textContent = '添加用户';
            document.getElementById('editId').value = '';
            form.reset();
            document.getElementById('pwdHint').textContent = '';
            document.getElementById('formPassword').required = true;
            overlay.classList.add('active');
        };

        window.editUser = (id, username, role) => {
            document.getElementById('modalTitle').textContent = '编辑用户';
            document.getElementById('editId').value = id;
            document.getElementById('formUsername').value = username;
            document.getElementById('formRole').value = role;
            document.getElementById('formPassword').value = '';
            document.getElementById('formPassword').required = false;
            document.getElementById('pwdHint').textContent = '(留空则不修改)';
            overlay.classList.add('active');
        };

        window.delUser = async (id) => {
            if (!confirm('确定删除该用户？')) return;
            await fetch(`/api/users/${id}`, { method: 'DELETE' });
            loadUsers();
        };

        document.getElementById('cancelBtn').onclick = () => overlay.classList.remove('active');
        overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('active'); };

        form.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const body = {
                username: document.getElementById('formUsername').value,
                role: document.getElementById('formRole').value
            };
            const pwd = document.getElementById('formPassword').value;
            if (pwd) body.password = pwd;

            const url = id ? `/api/users/${id}` : '/api/users';
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) { alert(data.error); return; }
            overlay.classList.remove('active');
            loadUsers();
        };

        document.getElementById('logoutBtn').onclick = async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        };

        loadUsers();
    </script>
</body>
</html>
