<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号设置 - 碎片时间收集器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; overflow-x: hidden; }
        .sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; z-index: 200; transition: transform 0.3s ease; }
        .sidebar-user { padding: 24px 20px; border-bottom: 1px solid #f3f4f6; text-align: center; cursor: pointer; text-decoration: none; display: block; }
        .sidebar-user:hover { background: #f9fafb; }
        .sidebar-user .avatar { width: 44px; height: 44px; border-radius: 50%; background: #6366f1; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 600; margin: 0 auto 10px; overflow: hidden; }
        .sidebar-user .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-user .name { font-size: 0.9rem; font-weight: 600; color: #1f2937; }
        .sidebar-nav { flex: 1; padding: 12px 8px; }
        .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.875rem; color: #4b5563; text-decoration: none; transition: all 0.15s; margin-bottom: 2px; }
        .sidebar-nav a:hover { background: #f3f4f6; color: #1f2937; }
        .sidebar-nav a.active { background: #eef2ff; color: #6366f1; font-weight: 500; }
        .sidebar-nav a svg { width: 18px; height: 18px; flex-shrink: 0; }
        .sidebar-footer { padding: 12px 8px; border-top: 1px solid #f3f4f6; }
        .sidebar-footer a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.875rem; color: #6366f1; text-decoration: none; font-weight: 500; background: #eef2ff; }
        .sidebar-footer a svg { width: 18px; height: 18px; flex-shrink: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 150; }
        .main-content { margin-left: 240px; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; transition: margin-left 0.3s ease; }
        .center-wrap { width: 100%; max-width: 440px; }
        .page-header { margin-bottom: 24px; text-align: center; }
        .page-header h2 { font-size: 1.25rem; font-weight: 600; color: #1f2937; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,0.04); padding: 28px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: #374151; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        .form-group input:disabled { background: #f9fafb; color: #9ca3af; cursor: not-allowed; }
        .form-group .hint { font-size: 0.75rem; color: #9ca3af; margin-top: 4px; }
        .btn { padding: 10px 24px; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #4f46e5; }
        .btn-outline { padding: 10px 24px; background: #fff; color: #6366f1; border: 1px solid #6366f1; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-outline:hover { background: #eef2ff; }
        .btn-danger { width: 100%; padding: 11px; background: #fff; color: #ef4444; border: 1px solid #fecaca; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-danger:hover { background: #fef2f2; border-color: #ef4444; }
        .invite-result { margin-top: 16px; text-align: center; display: none; }
        .invite-code { font-size: 1.8rem; font-weight: 700; color: #6366f1; letter-spacing: 0.2em; margin-bottom: 6px; }
        .invite-expire { font-size: 0.75rem; color: #9ca3af; }
        .toast { position: fixed; top: 24px; right: 24px; padding: 12px 20px; background: #10b981; color: #fff; border-radius: 8px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; z-index: 999; }
        .toast.show { opacity: 1; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <a href="/profile.html" class="sidebar-user">
            <div class="avatar" id="sideAvatar">?</div>
            <div class="name" id="sideName">加载中...</div>
        </a>
        <nav class="sidebar-nav">
            <a href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                主页
            </a>
            <a href="/admin.html" id="adminLink" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                用户管理
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="/settings.html" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                账号设置
            </a>
        </div>
    </aside>

    <div class="main-content">
        <div class="center-wrap">
            <div class="page-header"><h2>账号设置</h2></div>
            <div class="card">
                <form id="pwdForm">
                    <div class="form-group">
                        <label>账号</label>
                        <input type="text" id="inputUsername" disabled>
                        <div class="hint">账号不可修改</div>
                    </div>
                    <div class="form-group">
                        <label>修改密码</label>
                        <input type="password" id="inputPassword" placeholder="输入新密码">
                    </div>
                    <button type="submit" class="btn">保存密码</button>
                </form>
            </div>
            <div class="card" style="text-align:center">
                <div style="font-size:0.9rem;font-weight:600;color:#1f2937;margin-bottom:16px">生成邀请码</div>
                <button class="btn-outline" id="genInviteBtn">生成邀请码</button>
                <div class="invite-result" id="inviteResult">
                    <div class="invite-code" id="inviteCode"></div>
                    <div class="invite-expire" id="inviteExpire"></div>
                </div>
            </div>
            <div class="card" style="padding:20px">
                <button class="btn-danger" id="logoutBtn">退出登录</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast">保存成功</div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        let touchStartX = 0, touchStartY = 0, sidebarOpen = false;

        (async () => {
            const res = await fetch('/api/me');
            if (!res.ok) { window.location.href = '/login.html'; return; }
            const user = await res.json();
            document.getElementById('sideName').textContent = user.nickname;
            document.getElementById('sideAvatar').innerHTML = user.avatar ? `<img src="${user.avatar}">` : user.nickname.charAt(0).toUpperCase();
            document.getElementById('inputUsername').value = user.username;
            if (user.role === 'admin') document.getElementById('adminLink').style.display = '';
        })();

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        document.getElementById('pwdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = document.getElementById('inputPassword').value;
            if (!pwd) return;
            const res = await fetch('/api/profile', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
            if (res.ok) {
                document.getElementById('inputPassword').value = '';
                showToast('密码已更新');
            }
        });

        document.getElementById('genInviteBtn').addEventListener('click', async () => {
            const res = await fetch('/api/invite', { method: 'POST' });
            if (!res.ok) return;
            const data = await res.json();
            document.getElementById('inviteCode').textContent = data.code;
            document.getElementById('inviteExpire').textContent = '有效期至 ' + new Date(data.expiresAt).toLocaleString('zh-CN');
            document.getElementById('inviteResult').style.display = 'block';
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); sidebarOpen = true; }
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); sidebarOpen = false; }
        overlay.addEventListener('click', closeSidebar);
        document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            if (sidebarOpen) return;
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            if (dx > 30 && Math.abs(dy) < Math.abs(dx)) openSidebar();
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) < 30 || Math.abs(dy) > Math.abs(dx)) return;
            if (dx < 0 && sidebarOpen) closeSidebar();
        }, { passive: true });
    </script>
    <script src="/tracker.js"></script>
    <script src="/loader.js"></script>
</body>
</html>
