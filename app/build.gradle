plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zersum0h.fragmentedtimecollector'
    compileSdk 34

    defaultConfig {
        applicationId "com.zersum0h.fragmentedtimecollector"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
